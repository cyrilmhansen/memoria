[package]
name = "system-thumbnail-probe"
version = "0.1.0"
edition = "2021"
publish = false

[workspace]

[dependencies]
md-5 = "0.10"

[target.'cfg(windows)'.dependencies]
png = "0.17"
windows = { version = "0.61", features = [
  "Win32_Foundation",
  "Win32_Graphics_Gdi",
  "Win32_Storage_FileSystem",
  "Win32_System_Com",
  "Win32_System_Ole",
  "Win32_UI_Shell",
] }

[profile.release]
strip = true
lto = true
codegen-units = 1
