[package]
name = "mail-archive-experiment"
version = "0.1.0"
edition = "2021"
publish = false
build = "build.rs"

[dependencies]
ammonia = "4.1.4"
async-imap = { version = "0.11.3", default-features = false, features = ["runtime-tokio"] }
flate2 = "1.1"
fs4 = "0.13.1"
futures = "0.3"
blake3 = "1.8"
base64 = "0.22"
dirs = "6"
getrandom = "0.3"
html5ever = "0.39"
mailparse = "0.16.1"
open = "5"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
rfd = "0.17.2"
rusqlite = { version = "0.40", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tantivy = "0.26.1"
tokio = { version = "1", features = ["net", "rt-multi-thread", "time"] }
rustls = { version = "0.23", default-features = false, features = ["aws-lc-rs", "std", "tls12"] }
rustls-pki-types = "1"
tokio-rustls = "0.26"
url = "2.5"
webbrowser = "1"
zstd = "0.13"
slint = { version = "1.17.1", default-features = false, features = ["std", "backend-winit", "backend-winit-wayland", "backend-winit-x11", "renderer-software", "accessibility", "compat-1-2"] }
fontique = { version = "0.10.0", default-features = false, features = ["fontconfig-dlopen"] }

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62.2", features = [
    "Win32_Foundation",
    "Win32_Storage_IndexServer",
    "Win32_System_Com",
    "Win32_System_Com_StructuredStorage",
    "Win32_System_Registry",
    "Win32_UI_Shell",
] }

[build-dependencies]
slint-build = "1.17.1"
