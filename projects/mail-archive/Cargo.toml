[package]
name = "mail-archive-experiment"
version = "0.1.0"
edition = "2021"
publish = false
build = "build.rs"

[dependencies]
flate2 = "1.1"
blake3 = "1.8"
base64 = "0.22"
dirs = "6"
mailparse = "0.16.1"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
rfd = "0.17.2"
rusqlite = { version = "0.40", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tantivy = "0.26.1"
url = "2.5"
webbrowser = "1"
zstd = "0.13"
slint = { version = "1.17.1", default-features = false, features = ["std", "backend-winit", "backend-winit-wayland", "backend-winit-x11", "renderer-software", "accessibility", "compat-1-2"] }
fontique = { version = "0.10.0", default-features = false, features = ["fontconfig-dlopen"] }

[build-dependencies]
slint-build = "1.17.1"
