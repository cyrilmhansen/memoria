name: macOS ARM64

on:
  workflow_dispatch:

jobs:
  check-and-test:
    runs-on: [self-hosted, macOS, ARM64]

    steps:
      - uses: actions/checkout@v4

      - name: Toolchain
        run: |
          uname -m
          sw_vers
          rustc --version
          cargo --version

      - name: Check
        run: cargo check --workspace --all-targets

      - name: Clippy
        run: cargo clippy -p mail-archive-experiment --all-targets --all-features -- -D warnings

      - name: Tests
        run: cargo test --workspace
