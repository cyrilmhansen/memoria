name: Windows IFilter probe

on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: [self-hosted, Windows, X64, memoria-gui, windows-uia, ifilter]
    steps:
      - uses: actions/checkout@v4
      - name: Verify installed Rust toolchain
        shell: pwsh
        run: |
          rustc --version
          cargo --version
      - name: Build isolated probe
        shell: pwsh
        run: |
          cargo build --release --manifest-path experiments/windows-ifilter-probe/Cargo.toml
          $size = (Get-Item "experiments/windows-ifilter-probe/target/release/windows-ifilter-probe.exe").Length
          "helper_bytes=$size"
      - name: Generate controlled fixtures
        shell: pwsh
        run: powershell -ExecutionPolicy Bypass -File experiments/windows-ifilter-probe/fixtures/generate-fixtures.ps1
      - name: Generate real Word DOCX fixture with timeout
        shell: pwsh
        run: |
          $script = (Resolve-Path "experiments/windows-ifilter-probe/fixtures/generate-word-fixture.ps1").Path
          $process = Start-Process -FilePath "powershell.exe" -ArgumentList @("-NoProfile", "-ExecutionPolicy", "Bypass", "-File", $script) -PassThru -WindowStyle Hidden
          if (-not $process.WaitForExit(30000)) {
            Stop-Process -Id $process.Id -Force
            Write-Host "word_fixture=unavailable reason=timeout"
          } elseif ($process.ExitCode -ne 0) {
            Write-Host "word_fixture=unavailable reason=process_failed"
          } else {
            Write-Host "word_fixture=generated"
          }
      - name: Run controlled fixtures
        shell: pwsh
        run: |
          $PSNativeCommandUseErrorActionPreference = $false
          $probe = "experiments/windows-ifilter-probe/target/release/windows-ifilter-probe.exe"
          $phrase = "memoria-ifilter-probe-947"
          foreach ($name in @("sample.txt", "sample.html", "sample.pdf", "sample.docx", "sample-word.docx")) {
            $path = "experiments/windows-ifilter-probe/fixtures/$name"
            if (-not (Test-Path -LiteralPath $path)) { "fixture=$name status=unavailable"; continue }
            $output = Join-Path $env:RUNNER_TEMP "$name.stdout"
            $errorOutput = Join-Path $env:RUNNER_TEMP "$name.stderr"
            $watch = [Diagnostics.Stopwatch]::StartNew()
            $process = Start-Process -FilePath $probe -ArgumentList @($path) -Wait -PassThru -NoNewWindow -RedirectStandardOutput $output -RedirectStandardError $errorOutput
            $exitCode = $process.ExitCode
            $watch.Stop()
            $text = [IO.File]::ReadAllText($output)
            $diagnostic = [IO.File]::ReadAllText($errorOutput)
            $match = $text.Contains($phrase)
            $status = if ($exitCode -eq 0) { "success" } elseif ($exitCode -eq 3) { "unsupported" } else { "failed" }
            "fixture=$name status=$status phrase_found=$match elapsed_ms=$($watch.ElapsedMilliseconds) stdout_bytes=$([Text.Encoding]::UTF8.GetByteCount($text))"
            $diagnostic.Trim()
          }
      - name: Try observed PDF and DOCX handlers directly
        shell: pwsh
        run: |
          $PSNativeCommandUseErrorActionPreference = $false
          $probe = "experiments/windows-ifilter-probe/target/release/windows-ifilter-probe.exe"
          $phrase = "memoria-ifilter-probe-947"
          $direct = @(
            @{ name = "pdf"; clsid = "{6C337B26-3E38-4F98-813B-FBA18BAB64F5}"; path = "experiments/windows-ifilter-probe/fixtures/sample.pdf" },
            @{ name = "docx"; clsid = "{5A98B233-3C59-4B31-944C-0E560D85E6C3}"; path = "experiments/windows-ifilter-probe/fixtures/sample.docx" }
          )
          foreach ($item in $direct) {
            $output = Join-Path $env:RUNNER_TEMP "$($item.name)-direct.stdout"
            $errorOutput = Join-Path $env:RUNNER_TEMP "$($item.name)-direct.stderr"
            $watch = [Diagnostics.Stopwatch]::StartNew()
            $process = Start-Process -FilePath $probe -ArgumentList @("direct", $item.clsid, $item.path) -Wait -PassThru -NoNewWindow -RedirectStandardOutput $output -RedirectStandardError $errorOutput
            $exitCode = $process.ExitCode
            $watch.Stop()
            $text = [IO.File]::ReadAllText($output)
            $diagnostic = [IO.File]::ReadAllText($errorOutput)
            $match = $text.Contains($phrase)
            "direct=$($item.name) exit=$exitCode phrase_found=$match elapsed_ms=$($watch.ElapsedMilliseconds) stdout_bytes=$([Text.Encoding]::UTF8.GetByteCount($text))"
            $diagnostic.Trim()
          }
      - name: Resolve registered handlers and extract dynamically
        shell: pwsh
        run: |
          $PSNativeCommandUseErrorActionPreference = $false
          $probe = "experiments/windows-ifilter-probe/target/release/windows-ifilter-probe.exe"
          $phrase = "memoria-ifilter-probe-947"
          foreach ($extension in @(".txt", ".html", ".pdf", ".docx")) {
            & $probe discover $extension
          }
          foreach ($name in @("sample.pdf", "sample-word.docx")) {
            $path = "experiments/windows-ifilter-probe/fixtures/$name"
            if (-not (Test-Path -LiteralPath $path)) { "dynamic=$name status=unavailable"; continue }
            $output = Join-Path $env:RUNNER_TEMP "$name.dynamic.stdout"
            $errorOutput = Join-Path $env:RUNNER_TEMP "$name.dynamic.stderr"
            $process = Start-Process -FilePath $probe -ArgumentList @("dynamic", $path) -Wait -PassThru -NoNewWindow -RedirectStandardOutput $output -RedirectStandardError $errorOutput
            $text = [IO.File]::ReadAllText($output)
            $diagnostic = [IO.File]::ReadAllText($errorOutput)
            "dynamic=$name exit=$($process.ExitCode) phrase_found=$($text.Contains($phrase)) stdout_bytes=$([Text.Encoding]::UTF8.GetByteCount($text))"
            $diagnostic.Trim()
          }
      - name: Exercise helper supervision bounds
        shell: pwsh
        run: |
          $probe = "experiments/windows-ifilter-probe/target/release/windows-ifilter-probe.exe"
          foreach ($mode in @("test-sleep", "test-output", "test-crash")) {
            & $probe supervise $mode
          }
      - name: Report registered filter handlers
        shell: pwsh
        run: |
          $probe = "experiments/windows-ifilter-probe/target/release/windows-ifilter-probe.exe"
          foreach ($extension in @('.txt', '.html', '.pdf', '.docx')) { & $probe discover $extension }
      - name: Reproduce reported Windows tests
        shell: pwsh
        run: |
          $tests = @(
            "recovery_truncates_an_incomplete_tail",
            "serves_sanitized_html_and_cid_without_exposing_other_messages",
            "structured_search_combines_filters_without_post_filter_false_negatives"
          )
          foreach ($test in $tests) {
            $log = Join-Path $env:RUNNER_TEMP "$test.stdout.log"
            $errorLog = Join-Path $env:RUNNER_TEMP "$test.stderr.log"
            $process = Start-Process -FilePath "cargo" -ArgumentList @("test", "--workspace", $test, "--", "--nocapture") -Wait -PassThru -NoNewWindow -RedirectStandardOutput $log -RedirectStandardError $errorLog
            "test=$test exit=$($process.ExitCode)"
            Get-Content -LiteralPath $log | Select-String -Pattern "FAILED|passed|panicked|PermissionDenied|file in use|expected|test result"
            Get-Content -LiteralPath $errorLog | Select-String -Pattern "FAILED|passed|panicked|PermissionDenied|file in use|expected|test result"
          }
