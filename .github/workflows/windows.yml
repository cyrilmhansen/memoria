name: Windows

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  check-and-test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo check --workspace
      - name: Clippy baseline with warnings denied
        run: cargo clippy -p mail-archive-experiment --all-targets --all-features -- -D warnings
      - run: cargo test --workspace
      - name: Build CI profile
        run: cargo build --profile ci -p mail-archive-experiment --bin mail-archive-app
      - uses: actions/upload-artifact@v4
        with:
          name: memoria-windows-x86_64
          path: target/ci/mail-archive-app.exe
          if-no-files-found: error
      - name: Test workspace with static CRT
        run: cargo test --workspace
        env:
          RUSTFLAGS: -C target-feature=+crt-static
      - name: Build CI profile with static CRT
        run: cargo build --profile ci -p mail-archive-experiment --bin mail-archive-app
        env:
          RUSTFLAGS: -C target-feature=+crt-static
      - uses: actions/upload-artifact@v4
        with:
          name: memoria-windows-x86_64-static
          path: target/ci/mail-archive-app.exe
          if-no-files-found: error

  distribution-release:
    if: github.event_name == 'workflow_dispatch'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Build distribution release
        run: cargo build --release -p mail-archive-experiment --bin mail-archive-app
      - uses: actions/upload-artifact@v4
        with:
          name: memoria-windows-x86_64-release
          path: target/release/mail-archive-app.exe
          if-no-files-found: error
      - name: Build distribution release with static CRT
        run: cargo build --release -p mail-archive-experiment --bin mail-archive-app
        env:
          RUSTFLAGS: -C target-feature=+crt-static
      - uses: actions/upload-artifact@v4
        with:
          name: memoria-windows-x86_64-release-static
          path: target/release/mail-archive-app.exe
          if-no-files-found: error
