name: Windows

on:
  push:
  pull_request:

jobs:
  check-and-test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo check --workspace
      - run: cargo test --workspace
      - run: cargo build --release -p mail-archive-experiment --bin mail-archive-app
      - uses: actions/upload-artifact@v4
        with:
          name: memoria-windows-x86_64
          path: target/release/mail-archive-app.exe
          if-no-files-found: error
      - name: Test workspace with static CRT
        run: cargo test --workspace
        env:
          RUSTFLAGS: -C target-feature=+crt-static
      - name: Build release with static CRT
        run: cargo build --release -p mail-archive-experiment --bin mail-archive-app
        env:
          RUSTFLAGS: -C target-feature=+crt-static
      - uses: actions/upload-artifact@v4
        with:
          name: memoria-windows-x86_64-static
          path: target/release/mail-archive-app.exe
          if-no-files-found: error
